name = "noop-relay"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# No logpush, no analytics engine, no tail consumer: nothing records who called.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "noop-relay"
database_id = "74300238-26bc-4f1d-a16b-aad35750df7f"

[vars]
# The PRIVATE repository suggestions become issues in. Never the public app repository.
SUGGESTION_REPO = "DX23876/noop-suggestions"

# The cap on donated bytes, ever, in bytes. Nothing in Cloudflare stops R2 spending, so this is what
# does: when it is reached the service refuses donations until this number is raised. R2 gives away
# 10 GB (decimal); 8 GiB is 8.59 GB of that, about 19,900 full recordings at 432 KB each, and the rest
# is the margin that keeps an overshoot inside the free tier rather than one cent past it.
RAW_BUDGET_BYTES = "8589934592"

# Donated raw-motion recordings. Private bucket, and a lifecycle rule deletes objects after 24 months,
# which is the figure the app's explainer page states.
[[r2_buckets]]
binding = "RAW"
bucket_name = "noop-raw-donations"
